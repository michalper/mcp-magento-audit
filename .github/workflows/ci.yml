name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jakosc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Testy
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Typy
        run: mypy src
