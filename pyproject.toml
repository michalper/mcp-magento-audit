[project]
name = "mcp-magento-audit"
version = "0.1.1"
description = "MCP server for auditing Magento projects: update compatibility, module quality, dependency security"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michal Per" }]
keywords = ["mcp", "magento", "composer", "audit", "upgrade", "php"]
dependencies = ["mcp>=2.3,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/michalper/mcp-magento-audit"
Repository = "https://github.com/michalper/mcp-magento-audit"
Issues = "https://github.com/michalper/mcp-magento-audit/issues"

[project.scripts]
mcp-magento-audit = "mcp_magento_audit.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_magento_audit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["mcp_magento_audit"]

[tool.coverage.report]
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B404: importing subprocess isn't itself a risk; each call site is reviewed
# individually with its own `# nosec` (fixed argv, no shell=True, no untrusted input).
skips = ["B404"]
